<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Search result card</title>
<script src="./support.js"></script>
<script src="./phone-fit.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&amp;family=Inter:wght@400;700&amp;family=Poppins:wght@300;400;600&amp;family=Urbanist:wght@400;700&amp;display=swap">
<style>
body{margin:0}a{color:#004256;text-decoration:none}a:hover{color:#166a83}.ns{scrollbar-width:none}.ns::-webkit-scrollbar{display:none}input::placeholder,textarea::placeholder{color:#80a0aa}@keyframes harborPulse{0%,100%{opacity:0}50%{opacity:1}}.harbor-pulse{animation:harborPulse 1.8s ease-in-out infinite}@keyframes harborSwirl{to{transform:rotate(360deg)}}.harbor-swirl{animation:harborSwirl 1.6s linear infinite}@keyframes harborEnter{from{opacity:0;transform:scale(1.04);visibility:hidden}1%{visibility:visible}to{opacity:1;transform:none;visibility:visible}}.harbor-enter{animation:harborEnter .6s ease 1.8s both}@keyframes csFade{from{opacity:0}}@keyframes csRise{from{transform:translateY(100%)}}.cs-fade{animation:csFade .25s ease both}.cs-rise{animation:csRise .32s cubic-bezier(.2,.8,.2,1) both}@keyframes recWave{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}.rec-wave{animation:recWave .9s ease-in-out infinite}@keyframes csPop{from{opacity:0;transform:translateY(8px) scale(.97)}}.cs-pop{animation:csPop .18s ease-out both}@media (prefers-reduced-motion:reduce){.harbor-swirl,.harbor-pulse,.cs-fade,.cs-rise,.rec-wave,.cs-pop{animation:none}.harbor-enter{animation:harborEnter .01s linear 1.8s both}}
</style>
</helmet>
<article style="width:342px;display:flex;flex-direction:column;gap:6px;font-family:Poppins,sans-serif">
  <a href="{{ r.href }}" aria-label="{{ r.title }}" style="display:block;width:342px;height:200px;box-sizing:border-box;border:1px solid #c9c9c9;border-radius:12px;overflow:hidden">
    <img src="{{ r.img }}" alt="" style="width:100%;height:100%;object-fit:cover;display:block">
  </a>
  <div style="display:flex;align-items:flex-start;justify-content:space-between;padding-top:4px">
    <a href="{{ r.href }}" style="font-family:'DM Sans',sans-serif;font-weight:600;font-size:20px;line-height:normal;color:#004256">{{ r.title }}</a>
    <button type="button" onClick="{{ toggle }}" aria-pressed="{{ pressed }}" aria-label="Save event" style="border:none;background:none;padding:0;cursor:pointer;width:24px;height:24px">
      <sc-if value="{{ saved }}" hint-placeholder-val="{{ false }}"><img src="assets/6d3ce.svg" alt="" style="width:24px;height:24px;display:block"></sc-if>
      <sc-if value="{{ unsaved }}" hint-placeholder-val="{{ true }}"><img src="assets/4afac.svg" alt="" style="width:24px;height:24px;display:block"></sc-if>
    </button>
  </div>
  <div style="display:flex;flex-direction:column;font-size:16px;line-height:normal;color:#166a83;white-space:nowrap">
    <span>{{ r.when }}</span>
    <sc-if value="{{ hasWhere }}" hint-placeholder-val="{{ true }}"><span>{{ r.where }}</span></sc-if>
  </div>
  <dc-import name="AvatarStack" faces="{{ r.faces }}" label="{{ r.going }}" large="{{ true }}" hint-size="150px,20px"></dc-import>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"result": {"editor": null}, "$preview": {"width": 342, "height": 300}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { saved: null }; }
  renderVals() {
    const r = this.props.result ?? { title: 'Alumni Panel', img: 'assets/b87d7.webp', when: 'Nov. 16 · 5pm to 7pm', where: 'River Event Space', going: '86 going', faces: ['assets/50c28.webp', 'assets/b3e18.webp', 'assets/3650d.webp'], saved: false, href: '#' };
    const saved = this.state.saved === null ? !!r.saved : this.state.saved;
    return { r, saved, unsaved: !saved, hasWhere: !!r.where, pressed: saved ? 'true' : 'false', toggle: () => this.setState({ saved: !saved }) };
  }
}
</script>
</body>
</html>
