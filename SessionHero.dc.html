<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Session hero card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&amp;family=Inter:wght@400;700&amp;family=Poppins:wght@300;400;600&amp;family=Urbanist:wght@400;700&amp;display=swap">
<style>
body{margin:0}a{color:#004256;text-decoration:none}a:hover{color:#166a83}.ns{scrollbar-width:none}.ns::-webkit-scrollbar{display:none}input::placeholder,textarea::placeholder{color:#80a0aa}@keyframes harborPulse{0%,100%{opacity:0}50%{opacity:1}}.harbor-pulse{animation:harborPulse 1.8s ease-in-out infinite}@keyframes harborSwirl{to{transform:rotate(360deg)}}.harbor-swirl{animation:harborSwirl 1.6s linear infinite}@keyframes harborEnter{from{opacity:0;transform:scale(1.04);visibility:hidden}1%{visibility:visible}to{opacity:1;transform:none;visibility:visible}}.harbor-enter{animation:harborEnter .6s ease 1.8s both}@keyframes csFade{from{opacity:0}}@keyframes csRise{from{transform:translateY(100%)}}.cs-fade{animation:csFade .25s ease both}.cs-rise{animation:csRise .32s cubic-bezier(.2,.8,.2,1) both}@keyframes recWave{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}.rec-wave{animation:recWave .9s ease-in-out infinite}@keyframes csPop{from{opacity:0;transform:translateY(8px) scale(.97)}}.cs-pop{animation:csPop .18s ease-out both}@media (prefers-reduced-motion:reduce){.harbor-swirl,.harbor-pulse,.cs-fade,.cs-rise,.rec-wave,.cs-pop{animation:none}.harbor-enter{animation:harborEnter .01s linear 1.8s both}}
</style>
</helmet>
<a href="{{ href }}" aria-label="{{ aria }}" style="position:relative;display:flex;flex-direction:column;justify-content:space-between;width:{{ width }};height:200px;box-sizing:border-box;padding:9px 14px;border-radius:16px;overflow:hidden;font-family:Poppins,sans-serif;color:#fff">
  <sc-if value="{{ isCurrent }}" hint-placeholder-val="{{ true }}">
    <img src="assets/d4f31.webp" alt="" style="position:absolute;left:0;top:0.13%;width:100%;height:119.35%;object-fit:cover">
  </sc-if>
  <sc-if value="{{ isHome }}" hint-placeholder-val="{{ false }}">
    <img src="assets/4264d.webp" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">
  </sc-if>
  <div style="position:absolute;inset:0;background:linear-gradient(180deg, rgba(22,106,131,0) 50%, {{ fade }} 77.5%)"></div>
  <div style="position:relative;align-self:flex-start;display:flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:11px;background:{{ pillBg }}">
    <sc-if value="{{ dot }}" hint-placeholder-val="{{ true }}"><span style="width:6px;height:6px;border-radius:3px;background:#b90087"></span></sc-if>
    <sc-if value="{{ isCurrent }}" hint-placeholder-val="{{ true }}"><span style="font-family:Inter,sans-serif;font-weight:700;font-size:11px;color:#b90087;white-space:nowrap">Current session · 16 min left</span></sc-if>
    <sc-if value="{{ isUpcoming }}" hint-placeholder-val="{{ false }}"><span style="font-family:Inter,sans-serif;font-weight:700;font-size:11px;color:#fff;white-space:nowrap">Upcoming</span></sc-if>
    <sc-if value="{{ isLive }}" hint-placeholder-val="{{ false }}"><span style="font-family:Inter,sans-serif;font-weight:700;font-size:11px;color:#b90087;white-space:nowrap">Live</span></sc-if>
  </div>
  <div style="position:relative;display:flex;flex-direction:column;white-space:nowrap">
    <sc-if value="{{ isCurrent }}" hint-placeholder-val="{{ true }}">
      <span style="font-weight:600;font-size:16px;text-decoration:underline">Breaking into Product Design</span>
      <span style="font-size:12px">Room 204 · until 2:30 PM</span>
    </sc-if>
    <sc-if value="{{ isHome }}" hint-placeholder-val="{{ false }}">
      <span style="font-weight:600;font-size:16px">Career Fair</span>
      <span style="font-size:12px">Poetter Hall · 2 until 4:30 PM</span>
    </sc-if>
  </div>
</a>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant": {"editor": "enum", "options": ["current", "upcoming", "live"], "default": "current"}, "width": {"editor": "int", "default": 358}, "href": {"editor": null}, "$preview": {"width": 358, "height": 200}}'>
class Component extends DCLogic {
  renderVals() {
    const v = this.props.variant ?? 'current';
    const isCurrent = v === 'current', isUpcoming = v === 'upcoming', isLive = v === 'live';
    return {
      isCurrent, isUpcoming, isLive, isHome: !isCurrent,
      dot: isCurrent || isLive,
      pillBg: isUpcoming ? '#004256' : '#ffffff',
      fade: isUpcoming ? '#004256' : '#b90087',
      width: (this.props.width ?? 358) + 'px',
      href: this.props.href ?? '#',
      aria: isCurrent ? 'Current session: Breaking into Product Design' : 'Career Fair',
    };
  }
}
</script>
</body>
</html>
