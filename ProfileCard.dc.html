<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Attendee profile card</title>
<script src="./support.js"></script>
<script src="./phone-fit.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&amp;family=Inter:wght@400;700&amp;family=Poppins:wght@300;400;600&amp;family=Urbanist:wght@400;700&amp;display=swap">
<style>
body{margin:0}a{color:#004256;text-decoration:none}a:hover{color:#166a83}.ns{scrollbar-width:none}.ns::-webkit-scrollbar{display:none}input::placeholder,textarea::placeholder{color:#80a0aa}@keyframes harborPulse{0%,100%{opacity:0}50%{opacity:1}}.harbor-pulse{animation:harborPulse 1.8s ease-in-out infinite}@keyframes harborSwirl{to{transform:rotate(360deg)}}.harbor-swirl{animation:harborSwirl 1.6s linear infinite}@keyframes harborEnter{from{opacity:0;transform:scale(1.04);visibility:hidden}1%{visibility:visible}to{opacity:1;transform:none;visibility:visible}}.harbor-enter{animation:harborEnter .6s ease 1.8s both}@keyframes csFade{from{opacity:0}}@keyframes csRise{from{transform:translateY(100%)}}.cs-fade{animation:csFade .25s ease both}.cs-rise{animation:csRise .32s cubic-bezier(.2,.8,.2,1) both}@keyframes recWave{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}.rec-wave{animation:recWave .9s ease-in-out infinite}@keyframes csPop{from{opacity:0;transform:translateY(8px) scale(.97)}}.cs-pop{animation:csPop .18s ease-out both}@media (prefers-reduced-motion:reduce){.harbor-swirl,.harbor-pulse,.cs-fade,.cs-rise,.rec-wave,.cs-pop{animation:none}.harbor-enter{animation:harborEnter .01s linear 1.8s both}}
</style>
</helmet>
<button type="button" onClick="{{ tap }}" aria-label="{{ p.who }}" style="position:relative;width:300px;height:400px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;text-align:left;padding:10px;border:none;border-radius:16px;overflow:hidden;background:{{ p.bg }};font-family:Poppins,sans-serif;cursor:pointer;flex-shrink:0">
  <img src="{{ p.photo }}" alt="" style="position:absolute;left:0;top:0;width:100%;height:75%;object-fit:cover;object-position:center top;display:block">
  <span style="position:absolute;inset:0;background:linear-gradient(180deg, {{ p.fade }} 50%, {{ p.bg }} 74.625%)"></span>
  <span style="position:relative;display:flex;flex-direction:column;gap:8px;min-height:120px">
    <span style="font-family:'DM Sans',sans-serif;font-weight:600;font-size:24px;line-height:normal;color:#fff">{{ p.who }}</span>
    <span style="display:flex;flex-wrap:wrap;gap:6px 4px">
      <sc-for list="{{ p.chips }}" as="c" hint-placeholder-count="3">
        <span style="background:rgba(255,255,255,0.2);border:1px solid #fff;border-radius:999px;padding:3px 10px;font-family:'DM Sans',sans-serif;font-size:10px;line-height:1;color:#fff;white-space:nowrap">{{ c }}</span>
      </sc-for>
    </span>
    <span style="font-size:12px;line-height:normal;color:#fff">{{ p.bio }}</span>
  </span>
</button>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"person": {"editor": null}, "onTap": {"editor": null}, "$preview": {"width": 300, "height": 400}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props.person ?? { who: 'Jordan Newman', bg: '#004256', fade: 'rgba(0,66,86,0)', photo: 'assets/5365f.webp', chips: ['Study HCI', 'Accessibility', 'Startup Panel'], bio: 'I’m a user experience researcher at Target. I’m super passionate about mentoring the future generation of designers.' };
    return { p, tap: () => { if (typeof this.props.onTap === 'function') this.props.onTap(); } };
  }
}
</script>
</body>
</html>
