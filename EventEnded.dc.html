<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Event ended</title>
<script src="./support.js"></script>
<script src="./phone-fit.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&amp;family=Inter:wght@400;700&amp;family=Poppins:wght@300;400;600&amp;family=Urbanist:wght@400;700&amp;display=swap">
<style>
body{margin:0}a{color:#004256;text-decoration:none}a:hover{color:#166a83}.ns{scrollbar-width:none}.ns::-webkit-scrollbar{display:none}input::placeholder,textarea::placeholder{color:#80a0aa}@keyframes harborPulse{0%,100%{opacity:0}50%{opacity:1}}.harbor-pulse{animation:harborPulse 1.8s ease-in-out infinite}@keyframes harborSwirl{to{transform:rotate(360deg)}}.harbor-swirl{animation:harborSwirl 1.6s linear infinite}@keyframes harborEnter{from{opacity:0;transform:scale(1.04);visibility:hidden}1%{visibility:visible}to{opacity:1;transform:none;visibility:visible}}.harbor-enter{animation:harborEnter .6s ease 1.8s both}@keyframes csFade{from{opacity:0}}@keyframes csRise{from{transform:translateY(100%)}}.cs-fade{animation:csFade .25s ease both}.cs-rise{animation:csRise .32s cubic-bezier(.2,.8,.2,1) both}@keyframes recWave{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}.rec-wave{animation:recWave .9s ease-in-out infinite}@keyframes csPop{from{opacity:0;transform:translateY(8px) scale(.97)}}.cs-pop{animation:csPop .18s ease-out both}@media (prefers-reduced-motion:reduce){.harbor-swirl,.harbor-pulse,.cs-fade,.cs-rise,.rec-wave,.cs-pop{animation:none}.harbor-enter{animation:harborEnter .01s linear 1.8s both}}
</style>
</helmet>
<div style="position:fixed;inset:0;z-index:60;font-family:Poppins,sans-serif">
  <button type="button" aria-label="Close" onClick="{{ close }}" class="cs-fade" style="position:absolute;inset:0;width:100%;border:none;padding:0;background:rgba(0,30,40,0.55);cursor:pointer"></button>
  <div role="dialog" aria-modal="true" aria-labelledby="ended-title" class="cs-rise" style="position:absolute;left:0;right:0;bottom:0;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:16px;padding:10px 24px 34px;background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -8px 30px rgba(0,30,40,0.18)">
    <span aria-hidden="true" style="width:40px;height:5px;border-radius:3px;background:#cfcfcf"></span>
    <div style="width:100%;box-sizing:border-box;padding:22px 16px 18px;border-radius:16px;background:#ebfafe;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center">
      <img src="assets/5d50e.svg" alt="" style="width:148px;height:41px;display:block">
      <h2 id="ended-title" style="margin:4px 0 0;font-family:'DM Sans',sans-serif;font-weight:600;font-size:24px;line-height:normal;color:#004256">That’s a wrap!</h2>
      <p style="margin:0;font-size:14px;line-height:20px;color:#166a83">SCAD Career Fair has ended. Here’s how your voyage went.</p>
    </div>
    <div style="width:100%;display:flex;gap:8px">
      <sc-for list="{{ stats }}" as="st" hint-placeholder-count="3">
        <div style="flex:1;box-sizing:border-box;padding:10px 6px;border-radius:12px;border:1.5px solid #bbe2ec;display:flex;flex-direction:column;align-items:center;gap:2px">
          <span style="font-family:'DM Sans',sans-serif;font-weight:700;font-size:22px;line-height:normal;color:#004256">{{ st.v }}</span>
          <span style="font-size:12px;color:#166a83">{{ st.l }}</span>
        </div>
      </sc-for>
    </div>
    <div style="width:100%;display:flex;flex-direction:column;gap:4px">
      <a href="Wrapped.dc.html" style="height:52px;box-sizing:border-box;border-radius:8px;border:1.5px solid #fafeff;background:#26b2dc;color:#fafeff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;line-height:18px">Review event recap</a>
      <button type="button" onClick="{{ close }}" style="height:52px;border-radius:8px;border:1.5px solid #fafeff;background:#ebfafe;color:#004256;font:inherit;font-weight:600;font-size:14px;line-height:18px;cursor:pointer">Not now</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"onClose": {"editor": null}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      // Same numbers as the Wrapped slides.
      stats: [{ v: '18', l: 'notes' }, { v: '3', l: 'matches' }, { v: '2/3', l: 'goals met' }],
      close: () => { if (this.props.onClose) this.props.onClose(); },
    };
  }
}
</script>
</body>
</html>
