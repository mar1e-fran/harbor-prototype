<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Conversation starters pop-up</title>
<script src="./support.js"></script>
<script src="./phone-fit.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&amp;family=Inter:wght@400;700&amp;family=Poppins:wght@300;400;600&amp;family=Urbanist:wght@400;700&amp;display=swap">
<style>
body{margin:0}a{color:#004256;text-decoration:none}a:hover{color:#166a83}.ns{scrollbar-width:none}.ns::-webkit-scrollbar{display:none}input::placeholder,textarea::placeholder{color:#80a0aa}@keyframes harborPulse{0%,100%{opacity:0}50%{opacity:1}}.harbor-pulse{animation:harborPulse 1.8s ease-in-out infinite}@keyframes harborSwirl{to{transform:rotate(360deg)}}.harbor-swirl{animation:harborSwirl 1.6s linear infinite}@keyframes harborEnter{from{opacity:0;transform:scale(1.04);visibility:hidden}1%{visibility:visible}to{opacity:1;transform:none;visibility:visible}}.harbor-enter{animation:harborEnter .6s ease 1.8s both}@keyframes csFade{from{opacity:0}}@keyframes csRise{from{transform:translateY(100%)}}.cs-fade{animation:csFade .25s ease both}.cs-rise{animation:csRise .32s cubic-bezier(.2,.8,.2,1) both}@keyframes recWave{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}.rec-wave{animation:recWave .9s ease-in-out infinite}@keyframes csPop{from{opacity:0;transform:translateY(8px) scale(.97)}}.cs-pop{animation:csPop .18s ease-out both}@media (prefers-reduced-motion:reduce){.harbor-swirl,.harbor-pulse,.cs-fade,.cs-rise,.rec-wave,.cs-pop{animation:none}.harbor-enter{animation:harborEnter .01s linear 1.8s both}}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;font-family:Poppins,sans-serif">
  <button type="button" aria-label="Close conversation starters" onClick="{{ close }}" class="cs-fade" style="position:absolute;inset:0;border:none;padding:0;background:rgba(0,40,52,0.45);cursor:pointer"></button>
  <div role="dialog" aria-modal="true" aria-labelledby="ss-title" class="cs-rise" style="position:absolute;left:0;right:0;bottom:0;max-height:640px;box-sizing:border-box;display:flex;flex-direction:column;gap:16px;padding:10px 24px 34px;background:#fafeff;border-radius:20px 20px 0 0;box-shadow:0 -8px 30px rgba(0,30,40,0.18)">
    <div style="display:flex;justify-content:center"><span style="width:40px;height:5px;border-radius:3px;background:#cfcfcf"></span></div>
    <div style="display:flex;align-items:center;justify-content:space-between">
      <h2 id="ss-title" style="margin:0;font-weight:600;font-size:20px;line-height:26px;color:#004256">Conversation starters</h2>
      <button type="button" aria-label="Close" onClick="{{ close }}" style="width:44px;height:44px;margin-right:-10px;border:none;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#004256" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 3l12 12M15 3 3 15"/></svg>
      </button>
    </div>
    <div class="ns" role="tablist" aria-label="Categories" style="display:flex;gap:8px;overflow-x:auto;margin:0 -24px;padding:0 24px;flex-shrink:0">
      <sc-for list="{{ chips }}" as="c" hint-placeholder-count="6">
        <button type="button" role="tab" aria-selected="{{ c.sel }}" onClick="{{ c.pick }}" style="flex-shrink:0;height:32px;padding:0 12px;border-radius:55px;border:1.5px solid {{ c.border }};background:{{ c.bg }};color:{{ c.fg }};cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:600;font-size:13px;white-space:nowrap">{{ c.name }}</button>
      </sc-for>
    </div>
    <div class="ns" style="overflow-y:auto;display:flex;flex-direction:column;gap:20px">
      <sc-for list="{{ groups }}" as="g" hint-placeholder-count="1">
        <section style="display:flex;flex-direction:column;gap:10px">
          <div style="display:flex;align-items:center;gap:8px"><span aria-hidden="true" style="width:12px;height:12px;border-radius:6px;background:{{ g.bg }}"></span><h3 style="margin:0;font-weight:600;font-size:14px;line-height:18px;color:#004256">{{ g.name }}</h3></div>
          <sc-for list="{{ g.items }}" as="l" hint-placeholder-count="3">
            <button type="button" onClick="{{ l.toggle }}" aria-pressed="{{ l.usedStr }}" style="width:100%;box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:8px;border:1.5px solid {{ g.bg }};background:{{ l.bg }};cursor:pointer;text-align:left;font-family:Poppins,sans-serif;font-size:14px;line-height:20px;color:#004256">
              <span style="flex:1">“{{ l.text }}”</span>
              <span style="flex-shrink:0;font-size:11px;font-weight:600;color:#166a83">{{ l.tag }}</span>
            </button>
          </sc-for>
        </section>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"category": {"editor": "enum", "options": ["all", "workplace", "culture", "interview", "pitch", "funny"], "default": "all"}, "onClose": {"editor": null}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { cat: null, used: {} }; }
  renderVals() {
    const CATS = [
      { id: 'workplace', label: 'Workplace\nEnvironment', name: 'Workplace Environment', bg: '#1f92b4', lines: [
        'What does a typical week look like on your team?',
        'How does your team give feedback on work in progress?',
        'Is your studio remote, hybrid or in person?'] },
      { id: 'culture', label: 'Company\nCulture', name: 'Company Culture', bg: '#298d60', lines: [
        'What made you choose this company?',
        'How does the team celebrate a launch?',
        'What surprised you most when you joined?'] },
      { id: 'interview', label: 'Interview Tips', name: 'Interview Tips', bg: '#fe8ee0', lines: [
        'What do you look for in a portfolio review?',
        'How many projects should I walk through?',
        'What’s a question candidates should ask you?'] },
      { id: 'pitch', label: 'Pitch Yourself', name: 'Pitch Yourself', bg: '#e2a200', lines: [
        'Hi, I’m a SCAD student focused on UX research.',
        'I just wrapped a project on accessible transit apps.',
        'I’m looking for a summer internship in product design.'] },
      { id: 'funny', label: 'Funny', name: 'Funny', bg: '#b90087', lines: [
        'Which free snack here is actually worth it?',
        'Be honest: Figma or a whiteboard and a dream?',
        'What’s the strangest thing in your design toolkit?'] },
    ];
    const cat = this.state.cat ?? this.props.category ?? 'all';
    const used = this.state.used;
    const chipOf = (id, name, color) => { const on = cat === id; return { name, sel: on ? 'true' : 'false',
      bg: on ? color : '#ffffff', fg: on ? '#ffffff' : '#004256', border: on ? color : '#1f92b4', pick: () => this.setState({ cat: id }) }; };
    const chips = [chipOf('all', 'All', '#004256'), ...CATS.map((c) => chipOf(c.id, c.name, c.id === 'interview' ? '#b90087' : c.bg))];
    const shown = cat === 'all' ? CATS : CATS.filter((c) => c.id === cat);
    const groups = shown.map((c) => ({ ...c, items: c.lines.map((text, i) => { const k = c.id + i; const u = !!used[k];
      return { text, usedStr: u ? 'true' : 'false', tag: u ? 'Used ✓' : 'Tap when used', bg: u ? '#ebfafe' : '#ffffff',
        toggle: () => this.setState({ used: { ...used, [k]: !u } }) }; }) }));
    const close = () => { if (typeof this.props.onClose === 'function') this.props.onClose(); };
    return { chips, groups, close };
  }
}
</script>
</body>
</html>
