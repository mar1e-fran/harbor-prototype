<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nav bar</title>
<script src="./support.js"></script>
<script src="./phone-fit.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&amp;family=Inter:wght@400;700&amp;family=Poppins:wght@300;400;600&amp;family=Urbanist:wght@400;700&amp;display=swap">
<style>
body{margin:0}a{color:#004256;text-decoration:none}a:hover{color:#166a83}.ns{scrollbar-width:none}.ns::-webkit-scrollbar{display:none}input::placeholder,textarea::placeholder{color:#80a0aa}@keyframes harborPulse{0%,100%{opacity:0}50%{opacity:1}}.harbor-pulse{animation:harborPulse 1.8s ease-in-out infinite}@keyframes harborSwirl{to{transform:rotate(360deg)}}.harbor-swirl{animation:harborSwirl 1.6s linear infinite}@keyframes harborEnter{from{opacity:0;transform:scale(1.04);visibility:hidden}1%{visibility:visible}to{opacity:1;transform:none;visibility:visible}}.harbor-enter{animation:harborEnter .6s ease 1.8s both}@keyframes csFade{from{opacity:0}}@keyframes csRise{from{transform:translateY(100%)}}.cs-fade{animation:csFade .25s ease both}.cs-rise{animation:csRise .32s cubic-bezier(.2,.8,.2,1) both}@keyframes recWave{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}.rec-wave{animation:recWave .9s ease-in-out infinite}@keyframes csPop{from{opacity:0;transform:translateY(8px) scale(.97)}}.cs-pop{animation:csPop .18s ease-out both}@media (prefers-reduced-motion:reduce){.harbor-swirl,.harbor-pulse,.cs-fade,.cs-rise,.rec-wave,.cs-pop{animation:none}.harbor-enter{animation:harborEnter .01s linear 1.8s both}}
</style>
</helmet>
<nav aria-label="Main" style="width:390px;height:78px;box-sizing:border-box;background:#fafeff;padding:8px 16px 16px;display:flex;justify-content:center;align-items:flex-start">
  <a href="{{ homeHref }}" aria-current="{{ homeCur }}" style="width:71.6px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0;border-radius:8px;box-sizing:border-box;border:none;font:inherit;cursor:pointer;background:{{ homeBg }}">
    <sc-if value="{{ homeOn }}" hint-placeholder-val="{{ false }}"><img src="assets/1c084.svg" alt="" style="width:22px;height:24px;display:block"></sc-if>
    <sc-if value="{{ homeOff }}" hint-placeholder-val="{{ true }}"><span style="width:22px;height:24px;display:flex;align-items:center;justify-content:center"><img src="assets/960af.svg" alt="" style="width:17.685px;height:21px;transform:rotate(14.28deg);display:block"></span></sc-if>
    <span style="font-family:Poppins,sans-serif;font-size:12px;line-height:normal;white-space:nowrap;color:{{ homeColor }};font-weight:{{ homeWeight }}">Home</span>
  </a>
  <a href="#" data-proto-todo="Calendar" aria-current="{{ calCur }}" style="width:71.6px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0;border-radius:8px;box-sizing:border-box;border:none;font:inherit;cursor:pointer;background:{{ calBg }}">
    <sc-if value="{{ calOn }}" hint-placeholder-val="{{ false }}"><img src="assets/bc355.svg" alt="" style="width:24px;height:24px;display:block"></sc-if>
    <sc-if value="{{ calOff }}" hint-placeholder-val="{{ true }}"><img src="assets/69c70.svg" alt="" style="width:24px;height:24px;display:block"></sc-if>
    <span style="font-family:Poppins,sans-serif;font-size:12px;line-height:normal;white-space:nowrap;color:{{ calColor }};font-weight:{{ calWeight }}">Calendar</span>
  </a>
  <a href="{{ liveHref }}" aria-current="{{ liveCur }}" style="width:71.6px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0;border-radius:8px;box-sizing:border-box;border:none;font:inherit;cursor:pointer;background:{{ liveBg }}">
    <sc-if value="{{ liveOn }}" hint-placeholder-val="{{ false }}"><img src="assets/c2b6f.svg" alt="" style="width:24px;height:24px;display:block"></sc-if>
    <sc-if value="{{ liveOff }}" hint-placeholder-val="{{ true }}"><img src="assets/f2471.svg" alt="" style="width:24px;height:24px;display:block"></sc-if>
    <sc-if value="{{ liveMood }}" hint-placeholder-val="{{ false }}">
      <span style="position:relative;width:24px;height:24px;display:block">
        <img src="{{ moodHalo }}" alt="" class="harbor-pulse" style="position:absolute;left:-7px;top:-7px;width:38px;height:38px;display:block">
        <img src="{{ moodIcon }}" alt="" style="position:absolute;left:0;top:0;width:24px;height:24px;display:block">
      </span>
    </sc-if>
    <span style="font-family:Poppins,sans-serif;font-size:12px;line-height:normal;white-space:nowrap;color:{{ liveColor }};font-weight:{{ liveWeight }}">Live</span>
  </a>
  <a href="{{ histHref }}" aria-current="{{ histCur }}" style="width:71.6px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0;border-radius:8px;box-sizing:border-box;border:none;font:inherit;cursor:pointer;background:{{ histBg }}">
    <sc-if value="{{ histOn }}" hint-placeholder-val="{{ false }}"><img src="assets/cf9a6.svg" alt="" style="width:24px;height:24px;display:block"></sc-if>
    <sc-if value="{{ histOff }}" hint-placeholder-val="{{ true }}"><img src="assets/08bd9.svg" alt="" style="width:24px;height:24px;display:block"></sc-if>
    <span style="font-family:Poppins,sans-serif;font-size:12px;line-height:normal;white-space:nowrap;color:{{ histColor }};font-weight:{{ histWeight }}">History</span>
  </a>
  <a href="{{ profHref }}" aria-current="{{ profCur }}" style="width:71.6px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0;border-radius:8px;box-sizing:border-box;border:none;font:inherit;cursor:pointer;background:{{ profBg }}">
    <sc-if value="{{ profOn }}" hint-placeholder-val="{{ false }}"><img src="assets/3d468.svg" alt="" style="width:24px;height:24px;display:block"></sc-if>
    <sc-if value="{{ profOff }}" hint-placeholder-val="{{ true }}"><img src="assets/b5530.svg" alt="" style="width:24px;height:24px;display:block"></sc-if>
    <span style="font-family:Poppins,sans-serif;font-size:12px;line-height:normal;white-space:nowrap;color:{{ profColor }};font-weight:{{ profWeight }}">Profile</span>
  </a>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active": {"editor": "enum", "options": ["home", "calendar", "live", "history", "profile"], "default": "home"}, "liveEvent": {"editor": "boolean", "default": false}, "homeHref": {"editor": null}, "liveHref": {"editor": null}, "profileHref": {"editor": null}, "historyHref": {"editor": null}, "$preview": {"width": 390, "height": 78}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { mood: null, fair: null }; }
  componentDidMount() {
    this._sync = () => { let m = null, f = null; try { m = window.localStorage.getItem('harbor.mood'); f = window.localStorage.getItem('harbor.fair'); } catch (e) {} this.setState({ mood: m, fair: f }); };
    this._sync();
    try { window.addEventListener('storage', this._sync); window.addEventListener('harbor-mood', this._sync); window.addEventListener('harbor-fair', this._sync); } catch (e) {}
  }
  componentWillUnmount() { try { window.removeEventListener('storage', this._sync); window.removeEventListener('harbor-mood', this._sync); window.removeEventListener('harbor-fair', this._sync); } catch (e) {} }
  renderVals() {
    const active = this.props.active ?? 'home';
    const liveEvent = !!this.props.liveEvent;
    const MOODS = {
      anxious: { icon: 'assets/bf43c.svg', halo: 'assets/db9ad.svg', color: '#b90087' },
      uneasy: { icon: 'assets/34f0a.svg', halo: 'assets/b2a49.svg', color: '#e2a200' },
      ready: { icon: 'assets/078be.svg', halo: 'assets/5afb6.svg', color: '#298d60' },
      steady: { icon: 'assets/7a6d1.svg', halo: 'assets/1e634.svg', color: '#26b2dc' },
    };
    const m = MOODS[this.state.mood] || MOODS.anxious;
    const out = {
      homeHref: this.props.homeHref ?? 'Main.dc.html',
      // Live opens the event only once the student has checked in. Before that it
      // sends them to the registered event (to check in) or to Search (to find one).
      // Otherwise it opens the Live tab's waiting screen (no event / starts soon / wrapped up).
      liveHref: (active === 'live' || liveEvent || this.state.fair === 'live') ? (this.props.liveHref ?? 'LiveOverview.dc.html')
        : 'LiveWaiting.dc.html',
      profHref: this.props.profileHref ?? 'Profile.dc.html',
      histHref: this.props.historyHref ?? 'VoyageLogbook.dc.html',
      moodIcon: m.icon, moodHalo: m.halo,
    };
    const ids = { home: 'home', cal: 'calendar', live: 'live', hist: 'history', prof: 'profile' };
    Object.keys(ids).forEach((k) => {
      const on = active === ids[k];
      out[k + 'On'] = on; out[k + 'Off'] = !on; out[k + 'Cur'] = on ? 'page' : 'false';
      out[k + 'Bg'] = on ? '#004256' : 'transparent';
      out[k + 'Color'] = on ? '#ffffff' : '#004256';
      out[k + 'Weight'] = on ? 600 : 400;
    });
    out.liveMood = false;
    if (liveEvent && active !== 'live') { out.liveMood = true; out.liveOff = false; out.liveColor = m.color; out.liveWeight = 600; }
    return out;
  }
}
</script>
</body>
</html>
