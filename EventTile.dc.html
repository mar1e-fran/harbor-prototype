<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Event tile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&amp;family=Inter:wght@400;700&amp;family=Poppins:wght@300;400;600&amp;family=Urbanist:wght@400;700&amp;display=swap">
<style>
body{margin:0}a{color:#004256;text-decoration:none}a:hover{color:#166a83}.ns{scrollbar-width:none}.ns::-webkit-scrollbar{display:none}input::placeholder,textarea::placeholder{color:#80a0aa}@keyframes harborPulse{0%,100%{opacity:0}50%{opacity:1}}.harbor-pulse{animation:harborPulse 1.8s ease-in-out infinite}@keyframes harborSwirl{to{transform:rotate(360deg)}}.harbor-swirl{animation:harborSwirl 1.6s linear infinite}@keyframes harborEnter{from{opacity:0;transform:scale(1.04);visibility:hidden}1%{visibility:visible}to{opacity:1;transform:none;visibility:visible}}.harbor-enter{animation:harborEnter .6s ease 1.8s both}@keyframes csFade{from{opacity:0}}@keyframes csRise{from{transform:translateY(100%)}}.cs-fade{animation:csFade .25s ease both}.cs-rise{animation:csRise .32s cubic-bezier(.2,.8,.2,1) both}@keyframes recWave{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}.rec-wave{animation:recWave .9s ease-in-out infinite}@keyframes csPop{from{opacity:0;transform:translateY(8px) scale(.97)}}.cs-pop{animation:csPop .18s ease-out both}@media (prefers-reduced-motion:reduce){.harbor-swirl,.harbor-pulse,.cs-fade,.cs-rise,.rec-wave,.cs-pop{animation:none}.harbor-enter{animation:harborEnter .01s linear 1.8s both}}
</style>
</helmet>
<div style="width:150px;height:226px;display:flex;flex-direction:column;gap:4px;font-family:Poppins,sans-serif;flex-shrink:0">
  <a href="{{ ev.href }}" aria-label="{{ ev.title }}" style="position:relative;display:block;width:150px;height:96px;box-sizing:border-box;border:1px solid #c9c9c9;border-radius:8px;overflow:hidden;background:#efefef">
    <img src="{{ ev.img }}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block">
    <sc-if value="{{ ev.going }}" hint-placeholder-val="{{ false }}">
      <span style="position:absolute;left:10px;top:9px;height:22px;display:flex;align-items:center;padding:0 8px;border-radius:11px;background:#1f92b4;color:#fafeff;font-weight:600;font-size:12px">Going</span>
    </sc-if>
  </a>
  <div style="display:flex;align-items:flex-start;justify-content:space-between;width:150px">
    <a href="{{ ev.href }}" style="width:128px;font-weight:600;font-size:14px;line-height:normal;color:#004256">{{ ev.title }}</a>
    <button type="button" onClick="{{ toggle }}" aria-pressed="{{ pressed }}" aria-label="Save event" style="border:none;background:none;padding:0;cursor:pointer;width:24px;height:24px;flex-shrink:0">
      <sc-if value="{{ saved }}" hint-placeholder-val="{{ false }}"><img src="assets/6d3ce.svg" alt="" style="width:24px;height:24px;display:block"></sc-if>
      <sc-if value="{{ unsaved }}" hint-placeholder-val="{{ true }}"><img src="assets/4afac.svg" alt="" style="width:24px;height:24px;display:block"></sc-if>
    </button>
  </div>
  <span style="font-size:12px;line-height:normal;color:#166a83;white-space:nowrap">{{ ev.date }}</span>
  <span style="font-size:12px;line-height:normal;color:#166a83;white-space:nowrap">{{ ev.place }}</span>
  <dc-import name="AvatarStack" faces="{{ ev.faces }}" label="{{ ev.crew }}" hint-size="150px,20px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"ev": {"editor": null}, "$preview": {"width": 150, "height": 226}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { saved: null }; }
  renderVals() {
    const ev = this.props.ev ?? { title: 'Meet Designers Across Majors', date: 'Nov 10 · 4 pm to 6 pm', place: 'Haymans Hall', img: 'assets/10e4f.webp', going: false, saved: false, crew: '12 crewmates going', faces: ['assets/d15eb.webp', 'assets/7748d.webp', 'assets/db34d.webp'], href: '#' };
    const saved = this.state.saved === null ? !!ev.saved : this.state.saved;
    return { ev, saved, unsaved: !saved, pressed: saved ? 'true' : 'false', toggle: () => this.setState({ saved: !saved }) };
  }
}
</script>
</body>
</html>
