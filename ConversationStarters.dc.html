<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Conversation starters</title>
<script src="./support.js"></script>
<script src="./phone-fit.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&amp;family=Inter:wght@400;700&amp;family=Poppins:wght@300;400;600&amp;family=Urbanist:wght@400;700&amp;display=swap">
<style>
body{margin:0}a{color:#004256;text-decoration:none}a:hover{color:#166a83}.ns{scrollbar-width:none}.ns::-webkit-scrollbar{display:none}input::placeholder,textarea::placeholder{color:#80a0aa}@keyframes harborPulse{0%,100%{opacity:0}50%{opacity:1}}.harbor-pulse{animation:harborPulse 1.8s ease-in-out infinite}@keyframes harborSwirl{to{transform:rotate(360deg)}}.harbor-swirl{animation:harborSwirl 1.6s linear infinite}@keyframes harborEnter{from{opacity:0;transform:scale(1.04);visibility:hidden}1%{visibility:visible}to{opacity:1;transform:none;visibility:visible}}.harbor-enter{animation:harborEnter .6s ease 1.8s both}@keyframes csFade{from{opacity:0}}@keyframes csRise{from{transform:translateY(100%)}}.cs-fade{animation:csFade .25s ease both}.cs-rise{animation:csRise .32s cubic-bezier(.2,.8,.2,1) both}@keyframes recWave{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}.rec-wave{animation:recWave .9s ease-in-out infinite}@keyframes csPop{from{opacity:0;transform:translateY(8px) scale(.97)}}.cs-pop{animation:csPop .18s ease-out both}@media (prefers-reduced-motion:reduce){.harbor-swirl,.harbor-pulse,.cs-fade,.cs-rise,.rec-wave,.cs-pop{animation:none}.harbor-enter{animation:harborEnter .01s linear 1.8s both}}
</style>
</helmet>
<section aria-labelledby="cs-title" style="width:362px;display:flex;flex-direction:column;gap:12px;font-family:Poppins,sans-serif;color:#004256">
  <div style="height:18px;display:flex;align-items:center;justify-content:space-between">
    <h2 id="cs-title" style="margin:0;font-weight:600;font-size:14px;line-height:18px;color:#004256">Conversation starters</h2>
    <button type="button" onClick="{{ openAll }}" aria-haspopup="dialog" style="border:none;background:none;padding:0;cursor:pointer;font-family:Poppins,sans-serif;font-size:12px;line-height:18px;color:#004256;text-decoration:underline">View more</button>
  </div>
  <div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));column-gap:16px;row-gap:17px">
    <button type="button" onClick="{{ pickWork }}" aria-haspopup="dialog" style="position:relative;overflow:hidden;height:100px;box-sizing:border-box;border:none;border-radius:8px;background:#1f92b4;cursor:pointer;padding:0;font-family:Poppins,sans-serif;font-weight:600;font-size:14px;line-height:18px;color:#fff;text-align:center">
      <img alt="" src="assets/cs-work-wave.svg" style="position:absolute;left:-42px;top:78px;width:221px;height:24.24px;max-width:none;pointer-events:none">
      <img alt="" src="assets/cs-work-boat.svg" style="position:absolute;left:63.1px;top:6.54px;width:79.04px;height:90.4px;max-width:none;pointer-events:none;transform:rotate(5.43deg)">
      <img alt="" src="assets/cs-work-wave2.svg" style="position:absolute;left:-8px;top:84px;width:223px;height:28px;max-width:none;pointer-events:none">
      <span style="position:relative;display:block;padding:0 12px">Workplace<br>Environment</span>
    </button>
    <button type="button" onClick="{{ pickInterview }}" aria-haspopup="dialog" style="position:relative;overflow:hidden;height:100px;box-sizing:border-box;border:none;border-radius:8px;background:#fe8ee0;cursor:pointer;padding:0;font-family:Poppins,sans-serif;font-weight:600;font-size:14px;line-height:18px;color:#fff;text-align:center">
      <img alt="" src="assets/cs-int-a.svg" style="position:absolute;left:111px;top:14px;width:85px;height:102px;max-width:none;pointer-events:none">
      <img alt="" src="assets/cs-int-b.svg" style="position:absolute;left:-18.66px;top:21.68px;width:101.99px;height:116.69px;max-width:none;pointer-events:none;transform:rotate(-150deg)">
      <img alt="" src="assets/cs-int-c.svg" style="position:absolute;left:54px;top:29px;width:87px;height:84px;max-width:none;pointer-events:none">
      <span style="position:relative;display:block;padding:0 12px">Interview Tips</span>
    </button>
    <button type="button" onClick="{{ pickPitch }}" aria-haspopup="dialog" style="position:relative;overflow:hidden;height:100px;box-sizing:border-box;border:none;border-radius:8px;background:#e2a200;cursor:pointer;padding:0;font-family:Poppins,sans-serif;font-weight:600;font-size:14px;line-height:18px;color:#fff;text-align:center">
      <img alt="" src="assets/cs-pitch.svg" style="position:absolute;left:0px;top:7px;width:173px;height:98.57px;max-width:none;pointer-events:none">
      <span style="position:relative;display:block;padding:0 12px">Pitch Yourself</span>
    </button>
    <button type="button" onClick="{{ pickCulture }}" aria-haspopup="dialog" style="position:relative;overflow:hidden;height:100px;box-sizing:border-box;border:none;border-radius:8px;background:#298d60;cursor:pointer;padding:0;font-family:Poppins,sans-serif;font-weight:600;font-size:14px;line-height:18px;color:#fff;text-align:center">
      <img alt="" src="assets/cs-cult-a.svg" style="position:absolute;left:9.14px;top:5px;width:57.72px;height:91.87px;max-width:none;pointer-events:none">
      <img alt="" src="assets/cs-cult-b.svg" style="position:absolute;left:81px;top:27px;width:84.42px;height:70px;max-width:none;pointer-events:none">
      <span style="position:relative;display:block;padding:0 12px">Company<br>Culture</span>
    </button>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"onOpen": {"editor": null}, "$preview": {"width": 362, "height": 247}}'>
class Component extends DCLogic {
  renderVals() {
    const CATS = [
      { id: 'workplace', label: 'Workplace\nEnvironment', name: 'Workplace Environment', bg: '#1f92b4', lines: [
        'What does a typical week look like on your team?',
        'How does your team give feedback on work in progress?',
        'Is your studio remote, hybrid or in person?'] },
      { id: 'culture', label: 'Company\nCulture', name: 'Company Culture', bg: '#298d60', lines: [
        'What made you choose this company?',
        'How does the team celebrate a launch?',
        'What surprised you most when you joined?'] },
      { id: 'interview', label: 'Interview Tips', name: 'Interview Tips', bg: '#fe8ee0', lines: [
        'What do you look for in a portfolio review?',
        'How many projects should I walk through?',
        'What’s a question candidates should ask you?'] },
      { id: 'pitch', label: 'Pitch Yourself', name: 'Pitch Yourself', bg: '#e2a200', lines: [
        'Hi, I’m a SCAD student focused on UX research.',
        'I just wrapped a project on accessible transit apps.',
        'I’m looking for a summer internship in product design.'] },
      { id: 'funny', label: 'Funny', name: 'Funny', bg: '#b90087', lines: [
        'Which free snack here is actually worth it?',
        'Be honest: Figma or a whiteboard and a dream?',
        'What’s the strangest thing in your design toolkit?'] },
    ];
    const open = (id) => () => { if (typeof this.props.onOpen === 'function') this.props.onOpen(id); };
    return { pickWork: open('workplace'), pickCulture: open('culture'), pickInterview: open('interview'), pickPitch: open('pitch'), openAll: open('all') };
  }
}
</script>
</body>
</html>
