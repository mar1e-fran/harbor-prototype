class Component extends DCLogic {
  constructor(props) {
    super(props);

  }
  // Registration is remembered, so leaving and coming back still shows Unregister.
  storedReg(props) {
    const id = props.eventId || 'EventDetail';
    if (props.past) return !!props.startRegistered;
    try {
      if (id === 'EventDetail') {
        const f = window.localStorage.getItem('harbor.fair');
        // 'done' = the fair is over. The user went, so they still count as registered
        // (the bottom bar then offers the recap instead of Check In / Unregister).
        if (f === 'upcoming' || f === 'live' || f === 'done') return true;
        if (f === 'none') return false;
      } else {
        const list = JSON.parse(window.localStorage.getItem('harbor.reg') || '[]');
        if (list.includes(id)) return true;
      }
    } catch (e) {}
    return !!props.startRegistered;
  }
  saveReg(on) {
    const id = this.props.eventId || 'EventDetail';
    try {

      } else {
        const list = JSON.parse(window.localStorage.getItem('harbor.reg') || '[]').filter((x) => x !== id);

        window.localStorage.setItem('harbor.reg', JSON.stringify(list));
      }
