<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Profile</title>
<script src="./support.js"></script>
<script src="./phone-fit.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&amp;family=Inter:wght@400;700&amp;family=Poppins:wght@300;400;600&amp;family=Urbanist:wght@400;700&amp;display=swap">
<style>
body{margin:0}a{color:#004256;text-decoration:none}a:hover{color:#166a83}.ns{scrollbar-width:none}.ns::-webkit-scrollbar{display:none}input::placeholder,textarea::placeholder{color:#80a0aa}@keyframes harborPulse{0%,100%{opacity:0}50%{opacity:1}}.harbor-pulse{animation:harborPulse 1.8s ease-in-out infinite}@keyframes harborSwirl{to{transform:rotate(360deg)}}.harbor-swirl{animation:harborSwirl 1.6s linear infinite}@keyframes harborEnter{from{opacity:0;transform:scale(1.04);visibility:hidden}1%{visibility:visible}to{opacity:1;transform:none;visibility:visible}}.harbor-enter{animation:harborEnter .6s ease 1.8s both}@keyframes csFade{from{opacity:0}}@keyframes csRise{from{transform:translateY(100%)}}.cs-fade{animation:csFade .25s ease both}.cs-rise{animation:csRise .32s cubic-bezier(.2,.8,.2,1) both}@keyframes recWave{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}.rec-wave{animation:recWave .9s ease-in-out infinite}@keyframes csPop{from{opacity:0;transform:translateY(8px) scale(.97)}}.cs-pop{animation:csPop .18s ease-out both}@media (prefers-reduced-motion:reduce){.harbor-swirl,.harbor-pulse,.cs-fade,.cs-rise,.rec-wave,.cs-pop{animation:none}.harbor-enter{animation:harborEnter .01s linear 1.8s both}}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#fafeff;font-family:Poppins,sans-serif;color:#1a1a1a">
  <div class="ns" style="position:absolute;left:0;top:0;width:390px;bottom:78px;overflow-y:auto;overflow-x:hidden">
    <div style="position:relative;width:390px;height:230px">
      <img src="assets/p-cover.png" alt="" style="width:390px;height:170px;object-fit:cover;display:block">
      <span aria-hidden="true" style="position:absolute;left:24px;top:118px;width:104px;height:104px;box-sizing:border-box;border:4px solid #fff;border-radius:52px;background:#26b2dc;display:flex;align-items:center;justify-content:center;font-family:'DM Sans',sans-serif;font-weight:700;font-size:40px;color:#fff">{{ initials }}</span>
    </div>
    <div style="box-sizing:border-box;padding:8px 24px 40px;display:flex;flex-direction:column;gap:24px">
      <div style="display:flex;flex-direction:column;gap:14px">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">
          <span style="display:flex;flex-direction:column;min-width:0">
            <h1 style="margin:0;font-family:'DM Sans',sans-serif;font-weight:600;font-size:24px;line-height:normal;overflow-wrap:anywhere">{{ name }}</h1>
            <span style="padding-top:2px;font-size:16px;color:#6b6b6b">{{ roleLine }}</span>
          </span>
          <span style="margin-top:6px;height:26px;padding:0 10px;border-radius:13px;background:#004256;color:#fff;display:flex;align-items:center;font-weight:600;font-size:12px;white-space:nowrap">Crew 24</span>
        </div>
        <sc-if value="{{ hasEmail }}" hint-placeholder-val="{{ true }}"><p style="margin:-6px 0 0;font-size:14px;color:#6b6b6b;overflow-wrap:anywhere">{{ email }}</p></sc-if>
        <a href="OnboardingReview.dc.html?from=profile" style="height:48px;border-radius:8px;background:#004256;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:16px">Edit profile</a>
      </div>
      <section style="display:flex;border-radius:12px;background:#ebfafe;padding:14px 4px">
        <sc-for list="{{ stats }}" as="t" hint-placeholder-count="3">
          <span style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px"><b style="font-family:'DM Sans',sans-serif;font-weight:700;font-size:22px;color:#004256">{{ t.n }}</b><span style="font-size:12px;color:#5f6368">{{ t.k }}</span></span>
        </sc-for>
      </section>
      <section style="padding:16px;border-radius:12px;background:#c6fed4;display:flex;flex-direction:column;gap:12px">
        <h2 style="margin:0;font-weight:600;font-size:14px;line-height:18px;color:#004256">My goals</h2>
        <sc-if value="{{ hasGoals }}" hint-placeholder-val="{{ true }}">
          <div style="display:flex;flex-wrap:wrap;gap:8px">
            <sc-for list="{{ goals }}" as="g" hint-placeholder-count="3">
              <span style="display:flex;align-items:center;gap:4px;padding:4px 10px;border-radius:55px;background:#1f92b4;color:#fff;font-size:14px"><img src="{{ g.icon }}" alt="" style="width:18px;height:18px;filter:brightness(0) invert(1);display:block">{{ g.label }}</span>
            </sc-for>
          </div>
        </sc-if>
        <sc-if value="{{ noGoals }}" hint-placeholder-val="{{ false }}"><p style="margin:0;font-size:14px;color:#004256">No goals yet. Add a few so Harbor can pick events for you.</p></sc-if>
      </section>
      <section style="display:flex;flex-direction:column;gap:4px">
        <h2 style="margin:0 0 4px;font-family:'DM Sans',sans-serif;font-weight:600;font-size:20px;color:#202124">Links</h2>
        <sc-for list="{{ links }}" as="l" hint-placeholder-count="2">
          <div style="min-height:44px;display:flex;gap:10px;align-items:center;font-size:16px;overflow-wrap:anywhere"><img src="{{ l.icon }}" alt="" style="width:20px;height:20px;display:block;flex-shrink:0">{{ l.text }}</div>
        </sc-for>
        <sc-if value="{{ noLinks }}" hint-placeholder-val="{{ false }}"><p style="margin:0;font-size:14px;color:#5f6368">No links connected yet.</p></sc-if>
      </section>
      <section style="display:flex;flex-direction:column;gap:8px">
        <h2 style="margin:0;font-family:'DM Sans',sans-serif;font-weight:600;font-size:20px;color:#202124">My voyages</h2>
        <sc-for list="{{ voyages }}" as="v" hint-placeholder-count="2">
          <a href="{{ v.href }}" style="min-height:56px;display:flex;gap:12px;align-items:center;color:#1a1a1a">
            <img src="{{ v.img }}" alt="" style="width:56px;height:56px;border-radius:8px;object-fit:cover;display:block;flex-shrink:0">
            <span style="display:flex;flex-direction:column"><span style="font-size:16px">{{ v.title }}</span><span style="font-size:14px;color:#6b6b6b">{{ v.date }}</span></span>
          </a>
        </sc-for>
        <a href="VoyageLogbook.dc.html" style="height:44px;display:flex;gap:6px;align-items:center;font-size:16px;color:#1a1a1a">See all in History<img src="assets/p-showall.svg" alt="" style="width:18px;height:18px;display:block"></a>
      </section>
    </div>
  </div>
  <div style="position:absolute;left:0;bottom:0;width:390px;height:78px">
    <dc-import name="NavBar" active="profile" hint-size="390px,78px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { p: null, fair: null, notes: 0 }; }
  componentDidMount() {
    this._sync = () => {
      let p = null, fair = null, notes = 0;
      try {
        p = JSON.parse(window.localStorage.getItem('harbor.profile') || 'null');
        fair = window.localStorage.getItem('harbor.fair');
        notes = (JSON.parse(window.localStorage.getItem('harbor.notes') || '[]') || []).length;
      } catch (e) {}
      this.setState({ p, fair, notes });
    };
    this._sync();
    try { window.addEventListener('storage', this._sync); window.addEventListener('harbor-profile', this._sync); } catch (e) {}
  }
  componentWillUnmount() { try { window.removeEventListener('storage', this._sync); window.removeEventListener('harbor-profile', this._sync); } catch (e) {} }
  renderVals() {
    const p = this.state.p || {};
    const name = String(p.name || '').trim() || 'Evelyn Sharpe';
    const initials = name.split(/\s+/).slice(0, 2).map((w) => w[0] || '').join('').toUpperCase();
    const GOALS = {
      'Find a job': 'assets/aa222.svg', 'Find an internship': 'assets/82a05.svg', 'Practice networking': 'assets/7cb3b.svg', 'Gain confidence': 'assets/47a5f.svg',
      'Discover events': 'assets/97950.svg', 'Make connections': 'assets/4c12d.svg', 'Build professional relationships': 'assets/c30d9.svg',
      'Find mentors': 'assets/d556a.svg', 'Talk to recruiters': 'assets/47b6b.svg', 'Explore career opportunities': 'assets/e3e91.svg',
    };
    const goals = (p.goals || []).filter((g) => GOALS[g]).map((label) => ({ label, icon: GOALS[label] }));
    const links = [
      p.linkedin && { icon: 'assets/c576b.svg', text: 'linkedin.com/in/' + p.linkedin },
      p.instagram && { icon: 'assets/c8638.svg', text: '@' + p.instagram },
      p.website && { icon: 'assets/addb4.svg', text: p.website },
    ].filter(Boolean);
    const role = p.role || 'Student';
    const roleLine = [role, role === 'Student' ? p.grade : '', 'SCAD'].filter(Boolean).join(' · ');
    const done = this.state.fair === 'done';
    const voyages = [];
    if (this.state.fair && this.state.fair !== 'none') voyages.push({ title: 'SCAD Career Fair', date: done ? 'Nov 18 · attended' : 'Nov 18 · registered', img: 'assets/h-fair.png', href: done ? 'EventRecap.dc.html' : 'EventDetail.dc.html' });
    voyages.push({ title: 'Winter Game Jam: 48 Hours', date: 'Nov 13 · attended', img: 'assets/h-gamejam.png', href: 'VoyageLogbook.dc.html' });
    voyages.push({ title: 'Coffee With Creative Directors', date: 'Nov 11 · attended', img: 'assets/h-coffee.png', href: 'VoyageLogbook.dc.html' });
    return {
      name, initials, roleLine, email: p.email || '', hasEmail: !!p.email,
      goals, hasGoals: goals.length > 0, noGoals: goals.length === 0,
      links, noLinks: links.length === 0,
      stats: [
        { n: String(6 + (done ? 1 : 0)), k: 'Voyages' },
        { n: done ? '24' : '12', k: 'Crewmates' },
        { n: String(Math.max(this.state.notes, 0) + 18), k: 'Notes' },
      ],
      voyages,
    };
  }
}
</script>
</body>
</html>
