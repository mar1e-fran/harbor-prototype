<helmet>

<style>
body{margin:0}a{color:#004256;text-decoration:none}a:hover{color:#166a83}.ns{scrollbar-width:none}.ns::-webkit-scrollbar{display:none}input::placeholder,textarea::placeholder{color:#80a0aa}@keyframes harborPulse{0%,100%{opacity:0}50%{opacity:1}}.harbor-pulse{animation:harborPulse 1.8s ease-in-out infinite}@keyframes harborSwirl{to{transform:rotate(360deg)}}.harbor-swirl{animation:harborSwirl 1.6s linear infinite}@keyframes harborEnter{from{opacity:0;transform:scale(1.04);visibility:hidden}1%{visibility:visible}to{opacity:1;transform:none;visibility:visible}}.harbor-enter{animation:harborEnter .6s ease 1.8s both}@keyframes csFade{from{opacity:0}}@keyframes csRise{from{transform:translateY(100%)}}.cs-fade{animation:csFade .25s ease both}.cs-rise{animation:csRise .32s cubic-bezier(.2,.8,.2,1) both}@keyframes recWave{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}.rec-wave{animation:recWave .9s ease-in-out infinite}@keyframes csPop{from{opacity:0;transform:translateY(8px) scale(.97)}}.cs-pop{animation:csPop .18s ease-out both}@media (prefers-reduced-motion:reduce){.harbor-swirl,.harbor-pulse,.cs-fade,.cs-rise,.rec-wave,.cs-pop{animation:none}.harbor-enter{animation:harborEnter .01s linear 1.8s both}}
</style>
</helmet>

                <sc-if value="{{ notPaused }}" hint-placeholder-val="{{ true }}"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><rect x="2.5" y="2" width="2.5" height="8" rx="1" fill="#004256"/><rect x="7" y="2" width="2.5" height="8" rx="1" fill="#004256"/></svg></sc-if>

        <div style="position:absolute;left:0;bottom:0">

          <div role="menu" aria-label="Add to note" class="cs-pop" style="position:absolute;left:19px;top:302px;width:200px;box-sizing:border-box;padding:6px;border-radius:12px;background:#ffffff;box-shadow:0 10px 30px rgba(0,30,40,0.25);display:flex;flex-direction:column">
            <button type="button" role="menuitem" onClick="{{ pickCamera }}" style="height:48px;display:flex;align-items:center;gap:12px;padding:0 10px;border:none;border-radius:8px;background:none;cursor:pointer;font-family:Poppins,sans-serif;font-size:14px;color:#004256;text-align:left">
              <img src="assets/c94c7.svg" alt="" style="width:28px;height:28px;display:block">Camera

            <span aria-hidden="true" style="height:1px;margin:0 10px;background:#e2eef1"></span>
            <button type="button" role="menuitem" onClick="{{ pickUpload }}" style="height:48px;display:flex;align-items:center;gap:12px;padding:0 10px;border:none;border-radius:8px;background:none;cursor:pointer;font-family:Poppins,sans-serif;font-size:14px;color:#004256;text-align:left">

<script type="text/x-dc" data-dc-script data-props='{"startStep": {"editor": "enum", "options": ["blank", "write", "camera", "crop", "photo", "editing", "titled"], "default": "blank"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const step = props.startStep ?? 'blank';
    this.state = { id: null, save: null, rec: 'idle', secs: 0, menu: false, memos: [], step, photo: ['photo', 'editing', 'titled'].includes(step), title: step === 'titled' ? 'Product design photo' : 'Untitled Note', body: '' };
  }
  componentDidMount() {
    // Reopened notes: put the cursor after the existing text, not before it.
    setTimeout(() => { const t = document.querySelector('#dc-root textarea[aria-label="Note"]'); if (t && t.value) { const n = t.value.length; if (document.activeElement !== t) { try { t.focus({ preventScroll: true }); } catch (e) {} } try { t.setSelectionRange(n, n); } catch (e) {} } }, 60);
    let o = null, list = [];
    try { o = JSON.parse(window.localStorage.getItem('harbor.notes.open') || 'null'); list = JSON.parse(window.localStorage.getItem('harbor.notes') || '[]'); } catch (e) {}
    const fresh = !!(o && o.id && Date.now() - (o.at || 0) <= 15000);
    // Notes opened from the Voyage Logbook are edited after the fact; only the live notes flow ends the event.
    let ref = ''; try { ref = document.referrer || ''; } catch (e) {}
    this._fromLog = (fresh && o.from !== 'live') || /Logbook/i.test(ref);
    this._leave = () => this.leave();
    this._end = () => this.checkEnd();
    try { window.addEventListener('pagehide', this._leave); window.addEventListener('harbor-fair', this._end); window.addEventListener('storage', this._end); } catch (e) {}
    this.checkEnd();
    if (this.props.startStep && this.props.startStep !== 'blank') return;
    if (!fresh) return;
    const n = list.find((x) => x.id === o.id);
    if (n) this.setState({ id: n.id, title: n.title, body: n.body || '', photo: !!n.photo, memos: n.memos || [], step: n.photo ? 'editing' : 'write', save: 'saved' });
  }
  componentWillUnmount() {
    clearInterval(this._tick); clearTimeout(this._save); clearTimeout(this._endT);
    try { window.removeEventListener('pagehide', this._leave); window.removeEventListener('harbor-fair', this._end); window.removeEventListener('storage', this._end); } catch (e) {}
    if (this.state.save === 'saving') this.persist();
  }
  // Leaving the editor = the note's "done": flush any pending save, then (live event only) queue the end of the fair.
  leave() {
    let id = this.state.id;
    if (this.state.save === 'saving') { clearTimeout(this._save); id = this.persist(); }
    if (!this._dirty || !id || this._fromLog) return;
    try {
      if (window.localStorage.getItem('harbor.fair') !== 'live' || window.localStorage.getItem('harbor.fair.endAt')) return;
      window.localStorage.setItem('harbor.fair.endAt', String(Date.now() + 3000));
    } catch (e) {}
  }
  // Shared with LiveHeader: once harbor.fair.endAt passes, show the "That’s a wrap" pop-up.
  checkEnd() {
    clearTimeout(this._endT);
    let fair = null, at = 0;
    try { fair = window.localStorage.getItem('harbor.fair'); at = Number(window.localStorage.getItem('harbor.fair.endAt')) || 0; } catch (e) {}
    if (!at) return;
    if (fair !== 'live' || Date.now() - at > 120000) { try { window.localStorage.removeItem('harbor.fair.endAt'); } catch (e) {} return; }
    this._endT = setTimeout(() => {
      // The fair is over: show the wrap-up pop-up; its button opens the event recap.
      try { window.localStorage.setItem('harbor.fair', 'done'); window.localStorage.removeItem('harbor.fair.endAt'); } catch (e) {}
      this.setState({ ended: true });
      try { window.dispatchEvent(new Event('harbor-fair')); } catch (e) {}
    }, Math.max(0, at - Date.now()));
  }
  persist() {
    const { title, body, photo, memos } = this.state;
    const empty = !String(body || '').trim() && !photo && !(memos || []).length && (!title || title === 'Untitled Note');
    let id = this.state.id;
    let list = [];
    try { list = JSON.parse(window.localStorage.getItem('harbor.notes') || '[]'); } catch (e) {}
    if (empty) { if (id) list = list.filter((x) => x.id !== id); }
    else {
      if (!id) { id = 'n' + Date.now(); this.setState({ id }); }
      const time = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      const note = { id, title: title || 'Untitled Note', body: body || '', photo: !!photo, memos: memos || [], time };
      list = [note, ...list.filter((x) => x.id !== id)];
    }
    try { window.localStorage.setItem('harbor.notes', JSON.stringify(list)); window.dispatchEvent(new Event('harbor-notes')); } catch (e) {}
    return empty ? null : id;
  }
  edit(patch) { this._dirty = true; clearTimeout(this._save); this.setState({ ...patch, save: 'saving' }); this._save = setTimeout(() => { this.persist(); this.setState({ save: 'saved' }); }, 700); }
  startTick() { clearInterval(this._tick); this._tick = setInterval(() => this.setState({ secs: this.state.secs + 1 }), 1000); }
  renderVals() {
    const { step, title, body, photo, rec, secs, menu, memos } = this.state;
    const fmt = (n) => Math.floor(n / 60) + ':' + String(n % 60).padStart(2, '0');
    const isWrite = step === 'write';
    const WAVE = [8, 14, 20, 12, 24, 16, 10, 22, 14, 18, 9, 15];
    const go = (s) => () => this.setState({ step: s });
    const editing = step === 'editing' || step === 'titled' || step === 'write';
    return {
      isDraft: step === 'blank' || step === 'photo', hasPhoto: photo,
      draftText: String(body || '').trim() ? body : 'Drop a quick entry… who, company, what to remember',
      draftColor: String(body || '').trim() ? '#004256' : '#80a0aa', draftSize: String(body || '').trim() ? '14px' : '12px',
      bodyTop: photo ? '581px' : '92px', bodyH: photo ? '200px' : (isWrite ? '318px' : '680px'),
      isWrite, isIdle: rec === 'idle', isRec: rec !== 'idle', paused: rec === 'paused', notPaused: rec !== 'paused',
      pauseLabel: rec === 'paused' ? 'Resume recording' : 'Pause recording', clock: fmt(secs),
      wave: WAVE.map((h, i) => ({ h: h + 'px', d: (i * 0.09).toFixed(2) + 's' })), waveClass: rec === 'rec' ? 'rec-wave' : '',
      memos, hasMemos: memos.length > 0,
      record: () => { this.setState({ rec: 'rec', secs: 0, menu: false }); this.startTick(); },
      togglePause: () => { if (rec === 'paused') { this.setState({ rec: 'rec' }); this.startTick(); } else { clearInterval(this._tick); this.setState({ rec: 'paused' }); } },
      stop: () => { clearInterval(this._tick); this.edit({ rec: 'idle', memos: [...memos, 'Voice memo · ' + fmt(secs)], secs: 0 }); },
      menuOpen: menu, menuStr: menu ? 'true' : 'false', plusRot: menu ? '45deg' : '0deg',
      toggleMenu: () => this.setState({ menu: !menu }),
      pickCamera: () => this.setState({ menu: false, step: 'camera' }),
      pickUpload: () => this.edit({ menu: false, step: 'editing', photo: true }),
      kKey: (k) => this.edit({ body: this.state.body + k }),
      kDel: () => this.edit({ body: this.state.body.slice(0, -1) }),
      kRet: () => this.edit({ body: this.state.body + '\n' }),
      ended: !!this.state.ended, closeEnded: () => this.setState({ ended: false }), leave: () => this.leave(),
      isCamera: step === 'camera', isCrop: step === 'crop', isEditing: editing,
      title, body,
      openCamera: go('camera'), closeCamera: go(photo ? 'photo' : 'blank'), shoot: go('crop'), insert: () => this.edit({ step: 'editing', photo: true }),
      startEditing: () => this.setState({ step: photo ? 'editing' : 'write' }),
      newNote: () => { clearTimeout(this._save); this.setState({ step: 'blank', photo: false, title: 'Untitled Note', body: '', save: null, memos: [] }); },
      showSave: !!this.state.save, isSaved: this.state.save === 'saved', saveText: this.state.save === 'saved' ? 'Saved' : 'Saving…',
      saveColor: this.state.save === 'saved' ? '#21774f' : '#166a83',
      setTitle: (e) => this.edit({ title: e.target.value }),
      setBody: (e) => this.edit({ body: e.target.value }),
    };
  }
}
</script>
