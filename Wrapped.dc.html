<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wrapped</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&amp;family=Inter:wght@400;700&amp;family=Poppins:wght@300;400;600&amp;family=Urbanist:wght@400;700&amp;display=swap">
<style>
body{margin:0}a{color:#004256;text-decoration:none}a:hover{color:#166a83}.ns{scrollbar-width:none}.ns::-webkit-scrollbar{display:none}input::placeholder,textarea::placeholder{color:#80a0aa}@keyframes harborPulse{0%,100%{opacity:0}50%{opacity:1}}.harbor-pulse{animation:harborPulse 1.8s ease-in-out infinite}@keyframes harborSwirl{to{transform:rotate(360deg)}}.harbor-swirl{animation:harborSwirl 1.6s linear infinite}@keyframes harborEnter{from{opacity:0;transform:scale(1.04);visibility:hidden}1%{visibility:visible}to{opacity:1;transform:none;visibility:visible}}.harbor-enter{animation:harborEnter .6s ease 1.8s both}@keyframes csFade{from{opacity:0}}@keyframes csRise{from{transform:translateY(100%)}}.cs-fade{animation:csFade .25s ease both}.cs-rise{animation:csRise .32s cubic-bezier(.2,.8,.2,1) both}@keyframes recWave{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}.rec-wave{animation:recWave .9s ease-in-out infinite}@keyframes csPop{from{opacity:0;transform:translateY(8px) scale(.97)}}.cs-pop{animation:csPop .18s ease-out both}@media (prefers-reduced-motion:reduce){.harbor-swirl,.harbor-pulse,.cs-fade,.cs-rise,.rec-wave,.cs-pop{animation:none}.harbor-enter{animation:harborEnter .01s linear 1.8s both}}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;font-family:Poppins,sans-serif;background:{{ bg }}">

  <!-- W1 · intro -->
  <sc-if value="{{ s1 }}" hint-placeholder-val="{{ true }}">
    <button type="button" onClick="{{ next }}" aria-label="Next" style="position:absolute;inset:0;border:none;padding:0;background:#004256;cursor:pointer;text-align:left;font:inherit">
      <span style="position:absolute;left:-14px;top:427.5px;width:410.853px;height:308.796px;overflow:visible"><img src="assets/w1-waves.svg" alt="" style="position:absolute;left:0;top:-2.25px;width:411.073px;height:311.054px;display:block"></span>
      <span style="position:absolute;left:126.65px;top:594.16px;width:152.657px;height:169.553px;display:flex;align-items:center;justify-content:center"><img src="assets/w1-anchor.svg" alt="" style="width:122.111px;height:145px;transform:rotate(13.54deg);display:block"></span>
      <span style="position:absolute;left:0;top:736px;width:390px;height:105px;background:#004256"></span>
      <img src="assets/w1-wave-b.svg" alt="" style="position:absolute;left:-11px;top:716px;width:410.894px;height:76.25px;display:block">
      <img src="assets/w1-wave-c.svg" alt="" style="position:absolute;left:-16px;top:772px;width:410.853px;height:76.25px;display:block">
      <img src="assets/w1-coral.svg" alt="" style="position:absolute;left:-4px;top:772px;width:109.079px;height:105.143px;display:block">
      <span style="position:absolute;left:24px;top:229px;width:342px;font-family:'DM Sans',sans-serif;font-weight:700;font-size:40px;line-height:normal;color:#fff"><span style="color:#c6feff">Land ho!</span> That’s a wrap on {{ event }}.</span>
      <span style="position:absolute;left:24px;top:388px;width:342px;font-size:18px;line-height:27px;color:#d2e3fc">Here’s how your voyage went.</span>
    </button>
  </sc-if>

  <!-- W2 · people -->
  <sc-if value="{{ s2 }}" hint-placeholder-val="{{ false }}">
    <button type="button" onClick="{{ next }}" aria-label="Next" style="position:absolute;inset:0;border:none;padding:0;background:#115569;cursor:pointer;text-align:left;font:inherit">
      <img src="assets/w2-rope.svg" alt="" style="position:absolute;left:154.23px;top:280.5px;width:266.772px;height:300.005px;display:block">
      <span style="position:absolute;left:61px;top:546px;width:165.707px;height:178.956px;display:flex;align-items:center;justify-content:center"><img src="assets/w2-anchor.svg" alt="" style="width:122.111px;height:145px;transform:rotate(20.84deg);display:block"></span>
      <span style="position:absolute;left:24px;top:176px;width:342px;display:flex;flex-direction:column;gap:18px;color:#fff">
        <span style="font-weight:600;font-size:14px;color:#b3feff">You met</span>
        <span style="font-family:'DM Sans',sans-serif;font-weight:700;font-size:112px;line-height:112px;letter-spacing:5px">12</span>
        <span style="font-family:'DM Sans',sans-serif;font-weight:500;font-size:32px;line-height:normal">new shipmates.</span>
        <span style="font-size:18px;line-height:27px"><b style="color:#80fdff">5</b> of them matched your interests. You dropped anchor longest with <b style="color:#80fdff">{{ top }},</b> at the mixer.</span>
      </span>
      <span style="position:absolute;left:-9px;top:614px;width:417.752px;height:249.908px;display:flex;align-items:center;justify-content:center"><img src="assets/w2-kelp.svg" alt="" style="width:390.816px;height:157.708px;transform:rotate(14.39deg);display:block;flex-shrink:0"></span>
      <img src="assets/w2-coral-a.svg" alt="" style="position:absolute;left:-42px;top:698px;width:131.994px;height:157.926px;display:block">
      <span style="position:absolute;left:43px;top:713px;width:184px;height:194.042px;display:flex;align-items:center;justify-content:center"><img src="assets/w2-coral-b.svg" alt="" style="width:122.647px;height:152.544px;transform:rotate(-148.74deg);display:block"></span>
    </button>
  </sc-if>

  <!-- W3 · notes & moments -->
  <sc-if value="{{ s3 }}" hint-placeholder-val="{{ false }}">
    <button type="button" onClick="{{ next }}" aria-label="Next" style="position:absolute;inset:0;border:none;padding:0;background:#1f92b4;cursor:pointer;text-align:left;font:inherit">
      <img src="assets/w3-rope.svg" alt="" style="position:absolute;left:245px;top:-14px;width:94.873px;height:147px;display:block">
      <span style="position:absolute;left:-110px;top:157px;width:410.8px;height:563.9px;display:flex;align-items:center;justify-content:center;overflow:visible"><img src="assets/w3-anchor-big.svg" alt="" style="width:300.734px;height:507.738px;transform:rotate(13.47deg);display:block;flex-shrink:0;opacity:1"></span>
      <img src="assets/w3-bubble-c.svg" alt="" style="position:absolute;left:46px;top:165px;width:23.8px;height:22.82px;transform:rotate(13.47deg);display:block">
      <span style="position:absolute;left:24px;top:206px;width:342px;height:404px">
        <span style="position:absolute;left:150px;top:-91px;width:152.657px;height:169.553px;display:flex;align-items:center;justify-content:center"><img src="assets/w3-anchor.svg" alt="" style="width:122.111px;height:145px;transform:rotate(13.54deg);display:block"></span>
        <img src="assets/w3-bubble-e.svg" alt="" style="position:absolute;left:19px;top:-3px;width:12.98px;height:12.45px;transform:rotate(13.47deg);display:block">
        <span style="position:absolute;left:0;top:40px;font-weight:600;font-size:14px;color:#fff">Your notes</span>
        <span style="position:absolute;left:0;top:79px;width:342px;font-family:'DM Sans',sans-serif;font-weight:700;font-size:32px;line-height:35.84px;letter-spacing:-0.64px;color:#fff">You logged 18 notes.</span>
        <span style="position:absolute;left:0;top:133px;display:flex;flex-direction:column;gap:12px">
          <sc-for list="{{ sessions }}" as="r" hint-placeholder-count="3">
            <span style="display:flex;align-items:center;gap:12px">
              <span style="width:32px;height:32px;border-radius:8px;background:#004256;display:flex;align-items:center;justify-content:center;font-family:'DM Sans',sans-serif;font-size:16px;color:#fff;flex-shrink:0">{{ r.n }}</span>
              <span style="font-family:'DM Sans',sans-serif;font-size:16px;line-height:normal;color:#fff;max-width:208px;font-weight:{{ r.w }}">{{ r.name }}</span>
            </span>
          </sc-for>
        </span>
        <span style="position:absolute;left:0;top:281px;font-weight:600;font-size:14px;color:#fff">Your words on the voyage</span>
        <span style="position:absolute;left:0;top:316px;width:250px;display:flex;flex-wrap:wrap;gap:8px">
          <sc-for list="{{ words }}" as="w" hint-placeholder-count="4">
            <span style="min-height:40px;box-sizing:border-box;display:flex;align-items:center;padding:0 16px;border-radius:9999px;background:#56c2d6;font-weight:500;font-size:16px;color:#fff;white-space:nowrap">{{ w }}</span>
          </sc-for>
        </span>
        <img src="assets/w3-bubble-a.svg" alt="" style="position:absolute;left:296px;top:319px;width:23.8px;height:20.75px;transform:rotate(13.47deg);display:block">
        <img src="assets/w3-bubble-d.svg" alt="" style="position:absolute;left:306px;top:248px;width:10.82px;height:12.45px;transform:rotate(13.47deg);display:block">
        <img src="assets/w3-bubble-c.svg" alt="" style="position:absolute;left:303px;top:285px;width:23.8px;height:22.82px;transform:rotate(13.47deg);display:block">
        <img src="assets/w3-bubble-b.svg" alt="" style="position:absolute;left:330px;top:308px;width:12.98px;height:12.45px;transform:rotate(13.47deg);display:block">
      </span>
      <span style="position:absolute;left:162px;top:697px;width:162.84px;height:188.113px;display:flex;align-items:center;justify-content:center"><img src="assets/w3-bottle.svg" alt="" style="width:91.908px;height:164.201px;transform:rotate(-30.69deg);display:block"></span>
      <span style="position:absolute;left:241px;top:783px;width:114.9px;height:99.6px;display:flex;align-items:center;justify-content:center"><img src="assets/w3-pebbles.svg" alt="" style="width:66.94px;height:96.17px;transform:rotate(66.56deg);display:block"></span>
    </button>
  </sc-if>

  <!-- W4 · goal -->
  <sc-if value="{{ s4 }}" hint-placeholder-val="{{ false }}">
    <button type="button" onClick="{{ next }}" aria-label="Next" style="position:absolute;inset:0;border:none;padding:0;background:#2cb3db;cursor:pointer;text-align:left;font:inherit">
      <img src="assets/w4-wave-a.svg" alt="" style="position:absolute;left:-7px;top:820px;width:417px;height:18px;display:block">
      <img src="assets/w4-wave-b.svg" alt="" style="position:absolute;left:-20px;top:753px;width:417.041px;height:25.37px;display:block">
      <span style="position:absolute;left:24px;top:176px;width:342px;display:flex;flex-direction:column;gap:18px;color:#fff">
        <span style="font-size:16px;line-height:normal">Goal: Connect with 3 professionals in your desired industry</span>
        <span style="font-family:'DM Sans',sans-serif;font-weight:700;font-size:32px;line-height:35.84px;letter-spacing:-0.64px">You reached 66% of your goal</span>
        <span style="display:flex;gap:12px">
          <img src="assets/w4-jordan.png" alt="Jordan" style="width:44px;height:44px;box-sizing:border-box;border:2px solid #fff;border-radius:22px;object-fit:cover;display:block">
          <img src="assets/w4-priya.png" alt="Priya" style="width:44px;height:44px;box-sizing:border-box;border:2px solid #fff;border-radius:22px;object-fit:cover;display:block">
          <span style="width:44px;height:44px;border-radius:22px;background:#1f92b4;opacity:.4"></span>
        </span>
        <span style="font-size:18px;line-height:27px">So close! <b>{{ top }}</b> hinted at a role opening up in March.<br><br>You also did a breathing exercise before diving in. Nice work!</span>
      </span>
      <img src="assets/w4-squiggle.svg" alt="" style="position:absolute;left:89.6px;top:750.76px;width:157.736px;height:38.696px;display:block">
      <span style="position:absolute;left:36px;top:760px;width:70.889px;height:67.783px;display:flex;align-items:center;justify-content:center"><img src="assets/w4-anchor.svg" alt="" style="width:46.332px;height:55.019px;transform:rotate(59.65deg);display:block"></span>
      <span style="position:absolute;left:162px;top:570px;width:184.321px;height:205.942px;display:flex;align-items:center;justify-content:center"><img src="assets/w4-ship.svg" alt="" style="width:167px;height:191px;transform:rotate(5.43deg);display:block"></span>
      <img src="assets/w4-wave-c.svg" alt="" style="position:absolute;left:-20px;top:789px;width:417px;height:20px;display:block">
      <img src="assets/w4-wave-d.svg" alt="" style="position:absolute;left:-63px;top:799px;width:417.041px;height:25.37px;display:block">
    </button>
  </sc-if>

  <!-- Story chrome (W1–W4): progress + close -->
  <sc-if value="{{ story }}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute;left:24px;right:24px;top:56px;display:flex;gap:4px;pointer-events:none">
      <sc-for list="{{ bars }}" as="b" hint-placeholder-count="4"><span style="flex:1;height:4px;border-radius:2px;background:{{ b }}"></span></sc-for>
    </div>
    <div style="position:absolute;left:24px;right:24px;top:76px;height:44px;display:flex;align-items:center;justify-content:space-between">
      <span style="font-size:12px;color:#fff">{{ eyebrow }}</span>
      <a href="EventRecap.dc.html" aria-label="Skip to recap" style="width:44px;height:44px;border-radius:8px;display:flex;align-items:center;justify-content:center"><img src="assets/w-close.svg" alt="" style="width:22px;height:22px;display:block"></a>
    </div>
  </sc-if>

  <!-- W5 · share card -->
  <sc-if value="{{ s5 }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;background:#2cb3db">
      <div style="position:absolute;left:24px;right:24px;top:26px;display:flex;align-items:center;justify-content:space-between">
        <button type="button" onClick="{{ back }}" aria-label="Back" style="width:44px;height:44px;margin-left:-14px;border:none;background:none;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer"><img src="assets/w5-back.svg" alt="" style="width:17.47px;height:20px;display:block"></button>
        <a href="EventRecap.dc.html" aria-label="Close" style="width:44px;height:44px;border-radius:8px;display:flex;align-items:center;justify-content:center"><img src="assets/w5-close.svg" alt="" style="width:22px;height:22px;display:block"></a>
      </div>
      <article aria-label="Your Wrapped card" style="position:absolute;left:24px;right:24px;top:91px;height:624px;box-sizing:border-box;padding:20px 20px 0;border-radius:12px;background:#bbe2ec;overflow:hidden;display:flex;flex-direction:column;gap:19px;color:#004256">
        <img src="assets/w5-waves.svg" alt="" style="position:absolute;left:0;top:540px;width:342px;height:84px;display:block">
        <div style="display:flex;justify-content:space-between;font-size:14px"><span>Harbor</span><span>{{ dates }}</span></div>
        <h2 style="margin:0;font-family:'DM Sans',sans-serif;font-weight:600;font-size:24px;line-height:normal">{{ event }}</h2>
        <div style="display:flex;gap:16px;align-items:center">
          <span style="font-family:'DM Sans',sans-serif;font-weight:700;font-size:96px;line-height:normal">12</span>
          <span style="display:flex;flex-direction:column"><span style="font-size:20px;line-height:1.2">new<br>shipmates</span><span style="font-size:14px">18 min longest chat</span></span>
        </div>
        <div style="display:flex;padding-right:10px">
          <sc-for list="{{ faces }}" as="f" hint-placeholder-count="5"><img src="{{ f }}" alt="" style="width:44px;height:44px;box-sizing:border-box;border:2px solid #bbe2ec;border-radius:22px;object-fit:cover;margin-right:-10px;display:block"></sc-for>
          <span style="width:44px;height:44px;box-sizing:border-box;border:2px solid #bbe2ec;border-radius:22px;background:#fff;display:flex;align-items:center;justify-content:center;font-family:Inter,sans-serif;font-weight:700;font-size:12px;color:#1f92b4">+7</span>
        </div>
        <div style="display:flex;gap:8px">
          <sc-for list="{{ stats }}" as="s" hint-placeholder-count="3">
            <div style="flex:1;background:#fff;border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:2px;color:#1f92b4"><span style="font-family:'DM Sans',sans-serif;font-weight:600;font-size:24px">{{ s.v }}</span><span style="font-size:14px">{{ s.l }}</span></div>
          </sc-for>
        </div>
        <div style="display:flex;gap:16px">
          <sc-for list="{{ tops }}" as="t" hint-placeholder-count="2">
            <section style="flex:1">
              <h3 style="margin:0;font-weight:600;font-size:14px;line-height:18px">{{ t.h }}</h3>
              <ol style="margin:0;padding:8px 0 0;list-style:none;display:flex;flex-direction:column;gap:6px">
                <sc-for list="{{ t.items }}" as="i" hint-placeholder-count="3"><li style="display:flex;gap:8px;align-items:baseline"><span style="width:12px;font-weight:600;font-size:14px;line-height:18px">{{ i.n }}</span><span style="font-size:12px">{{ i.t }}</span></li></sc-for>
              </ol>
            </section>
          </sc-for>
        </div>
      </article>
      <div style="position:absolute;left:22px;right:26px;top:748px;height:56px;display:flex;gap:12px">
        <button type="button" onClick="{{ save }}" style="height:56px;box-sizing:border-box;padding:0 20px;border-radius:8px;border:1.5px solid #d2e3fc;background:none;display:flex;align-items:center;gap:8px;font:inherit;font-size:16px;color:#fff;cursor:pointer;white-space:nowrap"><img src="assets/w5-download.svg" alt="" style="width:18px;height:18px;display:block">{{ saveLabel }}</button>
        <button type="button" onClick="{{ share }}" style="flex:1;height:56px;border-radius:8px;border:none;background:#fff;font:inherit;font-weight:600;font-size:16px;color:#004256;cursor:pointer">{{ shareLabel }}</button>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"startStep": {"editor": "enum", "options": [1, 2, 3, 4, 5], "default": 1}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { step: Number(props.startStep) || 1, saved: false, shared: false }; }
  renderVals() {
    const { step, saved, shared } = this.state;
    const BG = { 1: '#004256', 2: '#115569', 3: '#1f92b4', 4: '#2cb3db', 5: '#2cb3db' };
    const lit = step === 4 ? '#ffffff' : '#d2e3fc';
    const dim = step === 3 ? '#4ca6c6' : 'rgba(210,227,252,0.25)';
    const event = 'SCAD Career Fair';
    return {
      step, bg: BG[step], event, top: 'Jordan Newman', dates: 'Nov 18',
      s1: step === 1, s2: step === 2, s3: step === 3, s4: step === 4, s5: step === 5, story: step < 5,
      eyebrow: step === 1 ? '' : event,
      bars: [1, 2, 3, 4].map((i) => (i <= step ? lit : dim)),
      sessions: [
        { n: 8, name: 'Building a Portfolio That Gets Interviews', w: 700 },
        { n: 4, name: 'Mixer', w: 400 },
        { n: 3, name: 'Opening keynote', w: 400 },
      ],
      words: ['hiring', 'design systems', 'portfolio', 'UX research'],
      faces: ['assets/w5-p1.png', 'assets/w5-p2.png', 'assets/w5-p3.png', 'assets/w5-p4.png', 'assets/w5-p5.png'],
      stats: [{ v: '18', l: 'notes' }, { v: '2/3', l: 'goal met' }, { v: '3', l: 'matches' }],
      tops: [
        { h: 'Top crewmates', items: [{ n: 1, t: 'Jordan' }, { n: 2, t: 'Priya' }, { n: 3, t: 'Casey' }] },
        { h: 'Top sessions', items: [{ n: 1, t: 'Portfolio talk' }, { n: 2, t: 'Mixer' }, { n: 3, t: 'Keynote' }] },
      ],
      saveLabel: saved ? 'Saved' : 'Save image',
      shareLabel: shared ? 'Link copied' : 'Share',
      next: () => this.setState({ step: Math.min(5, step + 1) }),
      back: () => this.setState({ step: 4 }),
      save: () => this.setState({ saved: true }),
      share: () => this.setState({ shared: true }),
    };
  }
}
</script>
</body>
</html>
